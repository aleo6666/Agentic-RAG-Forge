[project]
name = "rag-forge"
version = "0.1.0"
description = "Enterprise RAG pipeline — modular, observable, evaluable"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "李胜", email = "3140084978@qq.com" }]
keywords = ["rag", "langgraph", "enterprise", "knowledge-base", "hybrid-retrieval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "chromadb>=0.5.0",
    "qdrant-client>=1.11.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "pymupdf>=1.24.0",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "structlog>=24.0.0",
    "ragas>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
]
all = ["rag-forge[dev]"]

[project.scripts]
ragforge = "ragforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
